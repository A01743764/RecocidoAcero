name: Pruebas de etapa 1 (datos sinteticos)
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas unitarias sin datos industriales
        run: python -m pytest -q
      - name: Verificar sintaxis del modulo
        run: python -m py_compile src/analisis_cs.py
